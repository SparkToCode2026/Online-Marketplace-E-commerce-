# Local-only: Docker Compose merges this file into docker-compose.yml automatically,
# so on your machine "docker compose build" builds the images from source.
# Do NOT copy this file to the server — there the images are pulled from Docker Hub.
services:
  api:
    build:
      context: ./backend
      dockerfile: Online Marketplace (E-commerce)/Dockerfile

  bot:
    build: ./whatsapp-bot

  web:
    build: ./client
    ports:
      - "${WEB_PORT:-80}:80"

  # HTTPS is for the server only; locally the site stays on http://localhost
  caddy:
    profiles: [server-only]
