# Run everything: docker compose up -d --build   (needs a .env file, see .env.example)
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - mssql-data:/var/opt/mssql # keeps the data when the container is recreated
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api:
    build: "./backend/Online Marketplace (E-commerce)"
    environment:
      # "db" is the service name above — Docker's internal DNS resolves it
      ConnectionStrings__DefaultConnection: Server=db;Database=MarketplaceDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Jwt__Key: ${JWT_KEY}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mssql-data:
