<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Orders — Online Marketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div id="app-nav"></div>

  <main id="my-orders-page" class="container py-4">
    <h2 class="mb-4">My Orders</h2>

    <div class="row g-2 align-items-end mb-3">
      <div class="col-auto">
        <label for="filter-from" class="form-label mb-0">From</label>
        <input type="date" id="filter-from" class="form-control">
      </div>
      <div class="col-auto">
        <label for="filter-to" class="form-label mb-0">To</label>
        <input type="date" id="filter-to" class="form-control">
      </div>
      <div class="col-auto">
        <button id="filter-btn" class="btn btn-primary">Filter</button>
      </div>
      <div class="col-auto">
        <button id="clear-filter-btn" class="btn btn-outline-secondary">Clear</button>
      </div>
    </div>

    <div id="orders-list"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/orders.js"></script>
</body>
</html>
