<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout — Online Marketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div id="app-nav"></div>

  <main id="checkout-page" class="container py-4">
    <h2 class="mb-4">Checkout</h2>

    <div class="row g-4">
      <div class="col-lg-8">
        <h5>Order summary</h5>
        <div id="order-summary"></div>
      </div>

      <div class="col-lg-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Coupon</h5>
            <div class="input-group mb-3">
              <input type="text" id="coupon-code" class="form-control" placeholder="Coupon code">
              <button id="apply-coupon-btn" class="btn btn-outline-secondary" type="button">Apply</button>
            </div>

            <button id="confirm-purchase-btn" class="btn btn-primary w-100">Confirm Purchase</button>

            <div id="checkout-feedback" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/orders.js"></script>
</body>
</html>
