<!doctype html>
<!-- The single HTML file of the app. Vite injects main.tsx here,
     and React renders the whole app inside <div id="root">. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Organic design system: Caprasimo 400 (headings, single weight only)
         + Figtree 400/600/700 (body). Matches the system's @import exactly. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Caprasimo:wght@400&family=Figtree:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Online Marketplace</title>
  </head>
  <body class="font-body">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
