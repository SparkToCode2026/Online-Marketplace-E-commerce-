server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Vite puts a content hash in every asset filename, so they can be cached forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # React Router: unknown paths (e.g. /orders) fall back to index.html.
  # index.html itself is never cached, so a new deploy shows up immediately.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  # Browser calls /api/... on this same origin; nginx forwards to the backend container.
  # Resolving "api" through Docker's DNS on each request (instead of once at startup)
  # keeps this working after the api container is recreated with a new IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8080;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
