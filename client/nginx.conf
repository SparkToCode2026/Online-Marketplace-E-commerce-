server {
  listen 80;
  root /usr/share/nginx/html;

  # React Router: unknown paths (e.g. /orders) fall back to index.html
  location / {
    try_files $uri /index.html;
  }

  # Browser calls /api/... on this same origin; nginx forwards to the backend container
  location /api/ {
    proxy_pass http://api:8080;
  }
}
